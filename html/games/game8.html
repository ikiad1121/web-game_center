<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../../css/style.css" />
        <link rel="stylesheet" href="../../css/game8.css" />
        <title>はめ込みパズルゲーム</title>
    </head>
    <body>
        <header></header>
        <div class="topnav">
            <div id="topnav-platform1"></div>
            <div id="topnav-platform2"></div>
            <div id="topnav-platform3"></div>
        </div>
        <div class="nav-main">
            <div class="sidenav">
                <div id="sidenav-platform1"></div>
                <div id="sidenav-platform2"></div>
                <div id="sidenav-platform3"></div>
            </div>
            <main>
                <h1></h1>
                <div id="game8-start-div">
                    <button type="button" id="game-start-button">スタート</button>
                </div>
                <br>
                <div id="puzzle-main">
                    <h1>はめ込みパズルゲーム</h1>
                    <p>
                        このゲームはパズルボードを活用し、2分間で何問正答できるのかを競うゲームである。<br>
                        選択肢は1問につき3つ存在する。<br>
                    </p>
                    <br>
                    <p>
                        君は何問正答することが出来るかな？
                    </p>
                </div>
                <br>
                <div id="keyboard"></div>
                <br>
                <div id="timerboard"></div>
                <div id="scoreboard"></div>
                <div id="resultboard"></div>
                <br>
                <div id="comment1board"></div>
                <div id="comment2board"></div>
            </main>
        </div>
        <footer></footer>
        <script src="../../js/script.js"></script>
        <script src="../../js/platform1.js"></script>
        <script src="../../js/sideview1.js"></script>
        <script src="../../js/topview1.js"></script>
        <script src="../../js/game8.js"></script>
    </body>
</html>
