<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../../css/style.css" />
        <link rel="stylesheet" href="../../css/game6.css" />
        <title>神経衰弱ゲーム</title>
    </head>
    <body>
        <header></header>
        <div class="topnav">
            <div id="topnav-platform1"></div>
            <div id="topnav-platform2"></div>
            <div id="topnav-platform3"></div>
        </div>
        <div class="nav-main">
            <div class="sidenav">
                <div id="sidenav-platform1"></div>
                <div id="sidenav-platform2"></div>
                <div id="sidenav-platform3"></div>
            </div>
            <main>
                <h1></h1>
                <div id="game6-start-div">
                    <button type="button" id="game-start-button">スタート</button>
                </div>
                <br>
                <div id="trump-base">
                    <h1>神経衰弱ゲーム</h1>
                    <p>
                        このゲームは「1」～「4」が書かれた8枚のカードと
                        何も書かれていない1枚のカードを使用し、揃えばクリアのゲームである。<br>
                        何も書かれていないカードはジョーカー扱いで、引いた途端に即アウトとなる。
                    </p>
                </div>
                <br>
                <div id="scoreboard"></div>
            </main>
        </div>
        <footer></footer>
        <script src="../../js/script.js"></script>
        <script src="../../js/platform1.js"></script>
        <script src="../../js/sideview1.js"></script>
