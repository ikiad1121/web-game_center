<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../../css/style.css" />
        <link rel="stylesheet" href="../../css/game2.css" />
        <title>運試しドアゲーム</title>
    </head>
    <body>
        <header></header>
        <div class="topnav">
            <div id="topnav-platform1"></div>
            <div id="topnav-platform2"></div>
            <div id="topnav-platform3"></div>
        </div>
        <div class="nav-main">
            <div class="sidenav">
                <div id="sidenav-platform1"></div>
                <div id="sidenav-platform2"></div>
                <div id="sidenav-platform3"></div>
            </div>
            <main>
                <h1></h1>
                <div class="main-floats"></div>
                <div id="game2-start-div">
                    <button type="button" id="game-start-button">スタート</button>
                </div>
                <br>
                <div id="door-floor"></div>
                <br>
                <div id="scoreboard">
                    <h1>運試しドアゲーム</h1>
                    <p>
                        このゲームは2～4つのドアから次のフロアに繋がるゲームを探し、
                        ゴールを目指すゲームである。<br>
                        フロアは全部で6つあり、ドアの数は毎回異なっている。
                    </p>
                </div>
            </main>
        </div>
        <footer></footer>
        <script src="../../js/script.js"></script>
        <script src="../../js/platform1.js"></script>
        <script src="../../js/sideview1.js"></script>
        <script src="../../js/topview1.js"></script>
        <script src="../../js/game2.js"></script>
    </body>
</html>
