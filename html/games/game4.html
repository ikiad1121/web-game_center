<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../../css/style.css" />
        <link rel="stylesheet" href="../../css/game4.css" />
        <title>タイマーゲーム</title>
    </head>
    <body>
        <header></header>
        <div class="topnav">
            <div id="topnav-platform1"></div>
            <div id="topnav-platform2"></div>
            <div id="topnav-platform3"></div>
        </div>
        <div class="nav-main">
            <div class="sidenav">
                <div id="sidenav-platform1"></div>
                <div id="sidenav-platform2"></div>
                <div id="sidenav-platform3"></div>
            </div>
            <main>
                <h1></h1>
                <div id="game4-start-div">
                    <button type="button" id="game-start-button">スタート</button>
                </div>
                <br>
                <div class="timers">
                    <div id="timer-main"></div>
                </div>
                <br>
                <div id="game4-timerstop-div" class="game4-timerstop-button-off">
                    <button type="button" id="game4-timerstop-button">ストップ！</button>
                </div>
                <div id="scoreboard">
                    <h1>タイマーゲーム</h1>
                    <p>
                        このゲームはタイマーを活用し、ランダムに指定された秒数に合わせて「ストップ」ボタンを押すゲームである。
                    </p>
                </div>
                <div id="resultboard"></div>
                <br>
                <div id="comment1board"></div>
                <div id="comment2board"></div>
            </main>
        </div>
        <footer></footer>
        <script src="../../js/script.js"></script>
        <script src="../../js/platform1.js"></script>
        <script src="../../js/sideview1.js"></script>
        <script src="../../js/topview1.js"></script>
        <script src="../../js/game4.js"></script>
    </body>
</html>
